apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: minikube-cluster
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: minikube-cluster
  role: KarpenterNodeRole-minikube-cluster
  tags:
    Environment: Production
    FinOps: CostOptimized
