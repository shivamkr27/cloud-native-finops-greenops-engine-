apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kepler
  namespace: monitoring
  labels:
    release: prometheus-operator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kepler
  endpoints:
    - port: http
      interval: 10s
      path: /metrics
  namespaceSelector:
    matchNames:
      - kepler
