apiVersion: v1
kind: ServiceAccount
metadata:
  name: greenops-dashboard-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: greenops-dashboard-role
  namespace: default
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: greenops-dashboard-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: greenops-dashboard-sa
    namespace: default
roleRef:
  kind: Role
  name: greenops-dashboard-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greenops-dashboard
  namespace: default
  labels:
    app: greenops-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greenops-dashboard
  template:
    metadata:
      labels:
        app: greenops-dashboard
    spec:
      serviceAccountName: greenops-dashboard-sa
      containers:
        - name: dashboard
          image: greenops-dashboard:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 300m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: greenops-dashboard
  namespace: default
  labels:
    app: greenops-dashboard
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30505
      name: http
  selector:
    app: greenops-dashboard
